<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Wilfredo Valenzuela">
  <meta name="description" content="Pagina para informar horas mensual trabajadas en empaque">
  <title>Horas INSP</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/query.css">
</head>

<body class="body-ingresar">
  <main class="contenedor-principal">
    <h1>CONSULTA DE HORAS</h1>
    <h2>INGRESAR</h2>
    <form action="./consulta-mes.html">
      <div class="formulario-grupo">
        <div class="botones-info">
          <label for="dni">DNI</label>
          <input type="text" id="dni" name="dni" required minlength="7" maxlength="8" inputmode="numeric"
            placeholder="Ej: 38125879" autocomplete="username">
        </div>

        <div class="botones-info">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required minlength="6" maxlength="15"
            placeholder="1 mayus y 1 num minimo" autocomplete="current-password" pattern="(?=.*[A-Z])(?=.*[0-9]).+"
            title="La contraseña debe tener al menos una letra mayuscula y un número">
        </div>

        <button type="submit">INGRESAR</button>
        <a href="./olvide-contraseña.html">Olvide mi Contraseña</a>
      </div>

    </form>


  </main>
  <footer class="footer">
    <a href="../index.html">Regresar a Pagina Principal</a>
  </footer>

</body>

</html>
